<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>GBA Games Library · David Thompson</title>
    <meta name="description" content="Play Game Boy Advance games in your browser, online or offline, with keyboard, controller or touch. Made by David Thompson.">
    <meta name="theme-color" content="#01315f">
    <meta name="color-scheme" content="dark light">

    <!-- PWA / iOS -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GBA">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <!-- Apply a saved light/dark choice before first paint to avoid a flash. -->
    <script>
        try {
            var savedTheme = (JSON.parse(localStorage.getItem("gba.settings.v1") || "{}") || {}).theme;
            if (savedTheme === "light" || savedTheme === "dark") {
                document.documentElement.setAttribute("data-theme", savedTheme);
            }
        }
        catch (error) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/library.css">
</head>
<body class="page page--library">
    <a class="skip-link" href="#library">Skip to games</a>

    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="./" aria-label="GBA by David Thompson, home">
                <span class="brand__mark" aria-hidden="true">GBA</span>
                <span class="brand__by">
                    <span class="brand__by-text">by</span>
                    <img class="brand__logo only-light" src="icons/logo-black.png" alt="" width="397" height="186">
                    <img class="brand__logo only-dark" src="icons/logo-white.png" alt="" width="397" height="186">
                </span>
            </a>
            <nav class="site-header__actions" aria-label="App">
                <button type="button" class="btn btn--primary btn--small" data-install hidden>
                    <span aria-hidden="true">⤓</span> Install app
                </button>
                <button type="button" class="btn btn--icon btn--ghost" data-theme-toggle aria-label="Change theme">
                    <span data-theme-icon aria-hidden="true">◐</span>
                </button>
                <button type="button" class="btn btn--icon btn--ghost" data-open-settings="general" aria-label="Settings">
                    <span aria-hidden="true">⚙</span>
                </button>
            </nav>
        </div>
    </header>

    <main id="library" class="library" tabindex="-1">
        <section class="hero" aria-labelledby="library-title">
            <h1 id="library-title" class="hero__title">Game Library</h1>
            <p class="hero__sub"><span id="game-count"></span> ready to play. Use a keyboard, a controller or touch, online or offline.</p>
            <div class="toolbar" role="search">
                <label class="visually-hidden" for="game-search">Search games</label>
                <div class="search">
                    <span class="search__icon" aria-hidden="true">⌕</span>
                    <input type="search" id="game-search" class="search__input" placeholder="Search games…" autocomplete="off" spellcheck="false" aria-describedby="search-status">
                </div>
                <button type="button" class="chip-toggle" id="filter-downloaded" aria-pressed="false">
                    <span aria-hidden="true">✓</span> Downloaded
                </button>
                <button type="button" class="btn btn--ghost btn--small" data-open-settings="controls">Controls</button>
            </div>
            <p id="search-status" class="visually-hidden" aria-live="polite"></p>
        </section>

        <section class="shelf" data-section aria-labelledby="games-heading">
            <h2 id="games-heading" class="shelf__title">Games</h2>
            <ul class="grid" id="game-grid" role="list"></ul>
        </section>

        <section class="shelf" data-section aria-labelledby="collections-heading">
            <h2 id="collections-heading" class="shelf__title">Game collections</h2>
            <ul class="grid" id="collection-grid" role="list"></ul>
        </section>

        <p id="search-empty" class="empty" hidden>No games match your search.</p>
    </main>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <a class="site-footer__brand" href="https://davidthompson.dev" target="_blank" rel="noopener">
                <img class="only-light" src="icons/logo-black.png" alt="" width="397" height="186" loading="lazy">
                <img class="only-dark" src="icons/logo-white.png" alt="" width="397" height="186" loading="lazy">
                <span>Made by David Thompson</span>
            </a>
            <nav class="site-footer__links" aria-label="Footer">
                <button type="button" class="link-button" data-open-settings="controls">Controls &amp; help</button>
                <button type="button" class="link-button" data-open-settings="about">About</button>
                <a href="https://github.com/davidmthompson/GBA" target="_blank" rel="noopener">Source on GitHub</a>
            </nav>
            <p class="site-footer__note">Please only play games you own.</p>
        </div>
    </footer>

    <div id="hints" hidden></div>

    <script src="data/games.js"></script>
    <script type="module" src="ui/library.js"></script>
</body>
</html>
